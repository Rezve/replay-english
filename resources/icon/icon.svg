<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sheen)"/>

  <!-- Replay arrow: head at the top pointing left, arc sweeping round to the left side -->
  <g transform="translate(0 6)" fill="#ffffff" stroke="#ffffff">
    <path d="M 130 60 A 68 68 0 1 1 62.3 110.4" fill="none" stroke-width="22" stroke-linecap="round"/>
    <path d="M 92 60 L 132 27 L 132 93 Z" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Play -->
  <path d="M 117 112 L 117 156 L 154 134 Z" fill="#34d399" stroke="#34d399" stroke-width="10" stroke-linejoin="round"/>
</svg>
