name: Release

# Every push to main is inspected: if it contains releasable commits
# (feat / fix / perf / refactor) the version is bumped, installers are built for
# Windows, macOS and Linux, and one GitHub Release is published with all of them.
# Installed Windows apps then pick it up automatically from the latest release's RELEASES.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags + history to compute the version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version
        id: version
        run: |
          NEXT=$(node scripts/next-version.mjs)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ -z "$NEXT" ]; then echo "No releasable commits."; fi

  # Each platform builds natively: better-sqlite3 is rebuilt for Electron and
  # ffmpeg-static downloads its binary for the host OS/arch, so no cross-compiling.
  build:
    needs: version
    if: needs.version.outputs.next != ''
    strategy:
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set version
        shell: bash
        run: npm version "${{ needs.version.outputs.next }}" --no-git-tag-version --allow-same-version

      - name: Build installers
        run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: make-${{ matrix.name }}
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
          if-no-files-found: error

  # Publishes only once every platform has built, so a release is never partial.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes list the commits since the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: make-*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.next }}
        # Installed apps read RELEASES + the nupkg from the latest release's assets.
        # Notes list the shipped commits grouped by type (scripts/release-notes.mjs).
        run: |
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          cat release-notes.md
          find dist -type f -print0 | xargs -0 gh release create "v$VERSION" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md

      - name: Commit version bump
        run: |
          npm version "${{ needs.version.outputs.next }}" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore(release): v${{ needs.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
